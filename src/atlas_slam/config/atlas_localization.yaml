map_server:
  ros__parameters:
    # yaml_filename được RewrittenYaml tiêm vào lúc launch từ arg "map" (xem
    # localization.launch.py), không cần điền tay ở đây.
    yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

amcl:
  ros__parameters:
    # === Motion model: Differential cho robot 2 bánh (A3, không phải mecanum) ===
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05   # noise quay-do-quay (giảm → tin odom hơn, particles ít spread)
    alpha2: 0.05   # noise quay-do-tiến
    alpha3: 0.05   # noise tiến-do-tiến
    alpha4: 0.05   # noise tiến-do-quay
    alpha5: 0.05   # không dùng cho differential, giữ mặc định

    # === Frame config ===
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    tf_broadcast: true
    transform_tolerance: 0.5

    # === Laser config — RPLIDAR A1M8 ===
    scan_topic: /scan
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12       # A1M8 min range
    laser_max_range: 12.0      # A1M8 max ~12m
    laser_likelihood_max_dist: 2.0
    max_beams: 60               # 240 quá nặng CPU trên máy yếu (đo trên Inspiron 15-3567 2 nhân: CPU
                                # gần 100% liên tục, TF map->odom trễ >1s -> Nav2 tưởng lệch vị trí,
                                # huỷ goal, chạy Spin/Backup khôi phục -> robot "xoay vòng rồi aborted").
                                # 60 vẫn đủ dày cho phòng nhỏ/hành lang, đúng mức mặc định nav2_bringup.
    sigma_hit: 0.15            # siết lại → particles hội tụ chặt hơn về vị trí đúng

    # === Beam skip — lọc tia bị chặn bởi vật động ===
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # === Particle filter ===
    # min/max_particles từng tăng lên 1500/5000 để hội tụ chắc hơn, nhưng particle_filter là
    # O(particles * max_beams) mỗi update -- trên máy yếu (2 nhân, không GPU rời) mức đó ăn hết CPU,
    # TF trễ >1s, Nav2 huỷ goal liên tục. Hạ về gần mức mặc định nav2_bringup (500/2000) -- vẫn đủ hạt
    # cho không gian trong nhà cỡ vài chục m2. Nếu chạy trên máy khoẻ và cần độ chính xác cao hơn khi
    # robot lắc/di chuyển nhanh, có thể tăng lại (đồng thời tăng max_beams).
    min_particles: 500
    max_particles: 2000
    pf_err: 0.02               # giảm: yêu cầu particle filter chính xác hơn
    pf_z: 0.99
    resample_interval: 2       # resample mỗi 2 update thay vì 1 → tránh mất đa dạng hạt khi lắc
    recovery_alpha_fast: 0.05  # giảm: ít inject hạt ngẫu nhiên → tránh nhiễu khi lắc nhanh
    recovery_alpha_slow: 0.001

    # === Update triggers ===
    update_min_a: 0.01         # update khi quay ~3°
    update_min_d: 0.03         # update khi đi 3cm

    # === Sensor weights ===
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    lambda_short: 0.1

    save_pose_rate: 0.5