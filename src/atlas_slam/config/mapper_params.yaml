# Dựa trên mapper_params_online_async.yaml mặc định của slam_toolbox, chỉnh vài tham số
# cho khớp robot A3 thật (RPLidar A1M8, xem a3_bringup/launch/lidar.launch.py):
# - base_frame/odom_frame/map_frame/scan_topic: khớp TF/topic thật do a3_bringup publish
#   (odom -> base_footprint từ EKF, /scan đã lọc bỏ tia < 0.25m qua laser_filters).
# - min_laser_range: 0.12, dưới nhẹ range.min datasheet A1M8 (0.15m) -- vô hại vì /scan đã
#   lọc tia gần (< 0.25m) thay bằng +Inf trước khi tới đây, giữ nguyên để dự phòng.
# - max_laser_range: 9.5, dưới mức tối đa datasheet A1M8 (12.0m) để tránh dùng các tia gần
#   giới hạn cảm biến (kém tin cậy).
# - minimum_travel_distance/heading (0.2m/0.2rad) và loop_match_minimum_response_coarse/fine
#   (0.45/0.55, chặt hơn mặc định 0.35/0.45): tăng mật độ cập nhật map + siết loop closure,
#   phù hợp không gian trong nhà nhỏ/nhiều góc lặp lại (dễ nhầm 2 vị trí giống nhau là 1).
#   Nên kiểm tra lại khi có map thật đủ lớn, có thể nới lại nếu map rộng và thoáng.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 9.5
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
